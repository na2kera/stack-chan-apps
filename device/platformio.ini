; StackChan K151 自動撮影ファーム (device/)
;
; ボードパッケージとライブラリは docs/design/step1-device.md の「技術選定」に合わせて固定する。
; 変更するときは設計書と README の対応箇所も更新すること。
;
; - platform: pioarduino 55.03.312-1 = Arduino-ESP32 core 3.3.12 / ESP-IDF 5.5.5
;   (公式 platformio/espressif32 は core 2.0.x 止まりで、StackChan-BSP と M5Unified の
;    カメラ例が要求する core >= 3.2.2 を満たさないため pioarduino を使う)
; - StackChan-BSP: 1.1.0 タグは M5Unified 0.2.21+ の IOExpander API と非互換なので
;   main の commit を SHA で固定する

[env:k151]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; include/config.h が無ければ config.example.h からコピーする
extra_scripts = pre:tools/ensure_config.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    ; カメラと内部 I2C の共有を切り分けるときは次の行を有効にする
    ; (カメラを初期化せず、プレビュー枠だけ描く)
    ; -DPHOTOBOOTH_NO_CAMERA
    ; カメラ前後と Speaker 再初期化後のテスト音・アンプ状態を比較する
    ; -DPHOTOBOOTH_AUDIO_DIAGNOSTICS
    ; PR #1 の release() + カメラ専用バスを再現する (通常は既存バスを共有)
    ; -DPHOTOBOOTH_CAMERA_OWN_I2C
build_unflags =
    -std=gnu++11
board_build.partitions = default_16MB.csv
board_build.embed_files =
    data/announce.wav
    data/captured.wav
lib_deps =
    m5stack/M5Unified@0.2.24
    m5stack/M5GFX@0.2.31
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
    crankyoldgit/IRremoteESP8266@2.9.0
    m5stack/M5Unit-NFC@0.1.2
