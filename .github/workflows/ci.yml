name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      device: ${{ steps.filter.outputs.device }}
      edge: ${{ steps.filter.outputs.edge }}
      gallery: ${{ steps.filter.outputs.gallery }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            device:
              - 'device/**'
              - '.github/workflows/ci.yml'
            edge:
              - 'edge/**'
              - '.github/workflows/ci.yml'
            gallery:
              - 'gallery/**'
              - '.github/workflows/ci.yml'

  device-build:
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            device/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('device/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build device firmware
        working-directory: device
        run: |
          cp include/config.example.h include/config.h
          pio run

  edge-test:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.9'
          enable-cache: true
          cache-dependency-glob: edge/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test (no model, no hardware)
        run: uv run pytest

  gallery-test:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gallery/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
