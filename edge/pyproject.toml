[project]
name = "edge"
version = "0.1.0"
description = "StackChan photobooth edge service (face analysis, head control, capture session)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.35",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "httpx==0.28.1",
]

[project.scripts]
edge = "edge.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
